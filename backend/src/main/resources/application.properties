# These are the default (dev/demo) settings - safe to run locally out of the box, with
# zero external setup. See application-prod.properties for the overrides applied when
# started with `--spring.profiles.active=prod` (H2 console off, no auto schema changes).

# === Server ===
server.port=9000

# === H2 in-memory database ===
# A fresh, empty database is created every time the app starts - zero external setup.
spring.datasource.url=jdbc:h2:mem:paymentwallet;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Optional H2 web console for manual inspection during development.
# Visit http://localhost:8080/h2-console (JDBC URL above, blank password) while the app is running.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# === JPA / Hibernate ===
# ddl-auto=update lets Hibernate create the schema (including the UNIQUE constraint
# on transaction_id defined in the entity) on startup - no manual migration scripts needed.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Open-session-in-view is disabled: services return fully-mapped DTOs, so entities
# never need lazy-loading outside their transaction boundary.
spring.jpa.open-in-view=false

# === Logging ===
# Keep normal application logs clean; tests print their own structured summaries.
logging.level.root=WARN
logging.level.com.assignment.paymentwallet=INFO

# === Actuator ===
# Only the health endpoint is exposed - enough for the frontend's system-status
# section to show a real, live signal, without exposing env/beans/etc.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
