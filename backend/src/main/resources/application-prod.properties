# === Production-leaning overrides ===
# Applied on top of application.properties when started with
# `--spring.profiles.active=prod` (or SPRING_PROFILES_ACTIVE=prod).
#
# This project ships H2 in-memory by design (see DECISIONS.md) - a real deployment
# would point spring.datasource.* at Postgres/MySQL instead, most likely via
# environment variables rather than a committed properties file. This profile only
# turns off the demo-only conveniences that should never be exposed outside a local/
# interview environment; it does not attempt to be a full production configuration.

# H2's web console is a demo/dev convenience only - never expose it outside that context.
spring.h2.console.enabled=false

# Never let a schema-altering setting run unattended outside dev/demo. A real deployment
# should manage schema with versioned migrations (e.g. Flyway/Liquibase) instead.
spring.jpa.hibernate.ddl-auto=validate

# Quieter logs; no SQL/format noise.
logging.level.root=WARN
logging.level.com.assignment.paymentwallet=INFO
spring.jpa.show-sql=false
